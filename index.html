<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi affaires Ateliers – EES</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5f7;--card:#fff;--text:#1c2330;--muted:#6b7385;--border:#e2e5eb;--red:#c8102e;--redbg:#fdecef;--ok:#1f9d55;--okbg:#e6f6ec;--warn:#d97706;--warnbg:#fef3e2;--blue:#2563eb;--bluebg:#e8effd;--shadow:0 1px 3px rgba(20,30,50,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--card:#1b212b;--text:#e8ebf1;--muted:#9099ab;--border:#2b3342;--redbg:#3a1820;--okbg:#14301f;--warnbg:#3a2b12;--bluebg:#172640;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161d;--card:#1b212b;--text:#e8ebf1;--muted:#9099ab;--border:#2b3342;--redbg:#3a1820;--okbg:#14301f;--warnbg:#3a2b12;--bluebg:#172640;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.logo{height:48px;width:auto;background:#fff;padding:3px 8px;border-radius:8px;border:1px solid var(--border);display:block}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--border);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--red)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.dark{background:#000;border-color:#555;color:#fff}
.btn.white{background:#fff;border-color:#cfd4dc;color:#1c2330}
.btn.sm{padding:4px 9px;font-size:13px;font-weight:500}
.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(4,1fr);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.prog{grid-template-columns:1fr 1fr;margin-bottom:12px}
.bar{height:10px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .4s}
.bar.g i{background:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tools{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:8px;margin-bottom:12px}
.tools input,.tools select,.f input,.f select,.f textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--card)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:-1px}
.task{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;border-left:4px solid var(--border)}
.task.p-Haute{border-left-color:var(--red)}.task.p-Moyenne{border-left-color:var(--warn)}.task.p-Basse{border-left-color:var(--blue)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);background:none;cursor:pointer;display:grid;place-items:center;color:#fff;margin-top:1px}
.done .chk{background:var(--ok);border-color:var(--ok)}
.body{flex:1;min-width:0}
.t{font-weight:650;word-break:break-word}
.d{color:var(--muted);font-size:13.5px;margin:2px 0 6px;word-break:break-word}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.tag.proj{background:var(--redbg);color:var(--red);border-color:transparent;font-weight:700}
.tag.late{background:var(--redbg);color:var(--red);border-color:transparent}
.tag.soon{background:var(--warnbg);color:var(--warn);border-color:transparent}
.tag.s-doing{background:var(--bluebg);color:var(--blue);border-color:transparent}
.tag.s-done{background:var(--okbg);color:var(--ok);border-color:transparent}
.acts{display:flex;gap:6px;flex-direction:column;align-items:flex-end}
.acts select{padding:4px 6px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.ov{position:fixed;inset:0;background:rgba(10,15,25,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.on{display:flex}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:520px;max-height:100%;overflow:auto;padding:18px}
.f{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.f .full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:3px}
.err{color:var(--red);font-size:12.5px;min-height:16px}
#load:not(:empty){margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--bg);border-radius:99px;padding:3px 10px 3px 4px;cursor:pointer;font-size:13px}
.chip:hover{border-color:var(--red)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--redbg);color:var(--red);font-size:10.5px;font-weight:700}
.chip.on .av{background:#fff}
.tag.rsp{background:var(--bluebg);color:var(--blue);border-color:transparent}
.tag.rsp.na{background:var(--bg);color:var(--muted);border-color:var(--border)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:12px;width:max-content;max-width:100%}
.tab{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab.on{background:var(--red);color:#fff}
.tab2{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab2.on{background:var(--red);color:#fff}
.lr{display:grid;grid-template-columns:105px 1.5fr 1.2fr 130px 1fr 1fr 80px 80px 95px 100px 70px;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13.5px}
.lr>*{min-width:0;word-break:break-word}
.lh{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.lg{padding:8px 12px;background:var(--bg);font-weight:700;border-bottom:1px solid var(--border)}
.lrow:hover{background:var(--bg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.dr{display:grid;grid-template-columns:140px 1fr 28px 90px;gap:8px;align-items:center;margin-top:8px}
.dr2{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13.5px}
@media(max-width:720px){.dg{grid-template-columns:1fr}.dr{grid-template-columns:110px 1fr 24px}.dr .sub{display:none}}
.mr{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.mr .mt{flex:1;min-width:140px;word-break:break-word}
.sec{display:block;margin:12px 0 4px;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.note{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-top:6px}
.pbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pbar select{flex:1;min-width:150px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--card)}
.st{font-weight:600;border-color:transparent}
.st-0{background:var(--bg);color:var(--muted);border-color:var(--border)}
.st-1,.st-4{background:var(--bluebg);color:var(--blue)}
.st-2,.st-3{background:var(--warnbg);color:var(--warn)}
.st-5,.st-6{background:var(--okbg);color:var(--ok)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kv div{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:6px 10px}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-size:15px}
@media(max-width:720px){.kv{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.prog{grid-template-columns:1fr}.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}.f{grid-template-columns:1fr}.task{flex-wrap:wrap}.acts{flex-direction:row;width:100%;justify-content:flex-end}}
</style>
</head>

<div><label>Remise des plans prévue</label><input id="fdplans" type="date"></div>
<div><label>Livraison prévue</label><input id="fdliv" type="date"></div>
<div><label>Montant commande (€)</label><input id="fmont" type="number" min="0" step="any" inputmode="decimal"></div>
<div><label>Budget achat (€)</label><input id="fbud" type="number" min="0" step="any" inputmode="decimal"></div>
<div><label>Hrs RA</label><input id="fhra" type="number" min="0" step="any" inputmode="decimal"></div>
<div><label>Hrs Dessin</label><input id="fhdes" type="number" min="0" step="any" inputmode="decimal"></div>
<div class="full"><label>Hrs Ouvriers</label><input id="fhout" type="number" min="0" step="any" inputmode="decimal"></div>
</div>

<div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn" id="pcancel">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form></div>
</div>

<div class="ov" id="ov"><form class="modal" id="form" novalidate>
  <div class="row" style="margin-bottom:12px"><h1 id="mt">Nouvelle tâche</h1><button type="button" class="btn sm" id="cancel">✕</button></div>
  <div class="f">
    <div class="full"><label>Titre *</label><input id="title" maxlength="90" required></div>
    <div class="full"><label>Description courte</label><textarea id="desc" rows="2" maxlength="200"></textarea></div>
    <div><label>N° de projet *</label><select id="proj"></select></div>
    <div><label>Échéance</label><input id="due" type="date"></div>
    <div><label>Priorité</label><select id="prio"><option>Basse</option><option selected>Moyenne</option><option>Haute</option></select></div>
    <div><label>Catégorie</label><input id="cat" list="cats" value="Travail"><datalist id="cats"><option>Travail</option><option>Personnel</option><option>Projet</option></datalist></div>
    <div class="full"><label>RSP (responsable)</label><select id="rsp"></select></div>
    <div class="full"><label>Statut</label><select id="stat"><option value="todo">À faire</option><option value="doing">En cours</option><option value="done">Terminée</option></select></div>
  </div>
  <div class="err" id="err"></div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px"><button type="button" class="btn" id="cancel2">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div>
</form></div>

<script>
let API_URL="COLLER_ICI_L_ADRESSE_DU_SCRIPT";
try{const q=new URLSearchParams(location.search).get("api");if(q)localStorage.setItem("ees_api",q);const s=localStorage.getItem("ees_api");if(s&&API_URL.indexOf("http")!==0)API_URL=s}catch(e){}
const SYNC=API_URL.indexOf("http")===0;
var CODE="",SNAP=null,pushT=null,pushing=false,dirty=false;
try{CODE=localStorage.getItem("ees_code")||""}catch(e){}
const KEY="ees_taches_v1", TH="ees_theme", UK="ees_users_v1", NK="ees_notes_v1", PK="ees_pinfo_v1";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const SL={todo:"À faire",doing:"En cours",done:"Terminée"}, PW={Haute:0,Moyenne:1,Basse:2};
let tasks=[], editId=null, pendingDel=null, users=[], pendingU=null;
let notes=[], pendingN=null;
try{const n=JSON.parse(localStorage.getItem(NK));if(Array.isArray(n))notes=n}catch(e){}
const saveN=()=>{try{localStorage.setItem(NK,JSON.stringify(notes))}catch(e){}schedulePush()};
const nc=p=>notes.filter(n=>n.proj===p).length;
const STAT=["Nouvelle affaire","En études","En approbation","À l’atelier","En test","Testé","Livré"],ATE=["Sigma","Erezée","Externe"];
let pinfo={};try{const x=JSON.parse(localStorage.getItem(PK));if(x&&typeof x==="object"&&!Array.isArray(x))pinfo=x}catch(e){}
const saveP=()=>{try{localStorage.setItem(PK,JSON.stringify(pinfo))}catch(e){}schedulePush()};
const lbl=x=>{const i=pinfo[x],s=i&&[i.nom,i.client].filter(Boolean).join(" · ");return s?" — "+s:""};
const dayDiff=d=>Math.round((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5);
const lateLiv=i=>!!(i&&i.dliv&&i.statut!=="Livré"&&i.dliv<today());
const latePlans=i=>!!(i&&i.dplans&&STAT.indexOf(i.statut)<2&&i.dplans<today());
const dates=i=>{if(!i.dcmd&&!i.dplans&&!i.dliv)return "";return `<div class="tags" style="margin-top:6px">${i.dcmd?`<span class="tag">📅 Commande : ${fmt(i.dcmd)}</span>`:""}${i.dplans?`<span class="tag ${latePlans(i)?"late":""}">📐 Remise des plans : ${fmt(i.dplans)}${latePlans(i)?" · en retard":""}</span>`:""}${i.dliv?`<span class="tag ${lateLiv(i)?"late":""}">🚚 Livraison prévue : ${fmt(i.dliv)}${lateLiv(i)?" · en retard":""}</span>`:""}</div>`};
const eur=n=>new Intl.NumberFormat("fr-BE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(+n||0);
const num=n=>new Intl.NumberFormat("fr-BE",{maximumFractionDigits:1}).format(+n||0);
const tot=ps=>{let m=0,h=0,b=0;ps.forEach(p=>{const i=pinfo[p]||{};m+=+i.montant||0;b+=+i.budget||0;h+=(+i.hra||0)+(+i.hdes||0)+(+i.hout||0)});return `Montant commandes ${eur(m)} · Budget achat ${eur(b)} · ${num(h)} h`};
const fillSel=(id,arr,v,blank,srt)=>{const a=[...new Set([...arr,...(v&&!arr.includes(v)?[v]:[])])];if(srt)a.sort((x,y)=>x.localeCompare(y,"fr"));$(id).innerHTML=(blank?`<option value="">${blank}</option>`:"")+a.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("")};
const fiche=p=>{const i=pinfo[p];if(!i)return `<div class="row" style="align-items:center;margin-top:8px"><span class="sub">Fiche projet non renseignée.</span><button class="btn sm" data-pf="${esc(p)}">Renseigner</button></div>`;
  const h=(+i.hra||0)+(+i.hdes||0)+(+i.hout||0),si=STAT.indexOf(i.statut);
  return `<div class="tags" style="margin-top:8px"><span class="tag st st-${si<0?0:si}">${esc(i.statut||"—")}</span><span class="tag">🏭 ${esc(i.atelier||"Atelier non défini")}</span><span class="tag">🚚 Livraison : ${esc(i.livr||"—")}</span></div>
  <div class="tags" style="margin-top:6px"><span class="tag">Resp. affaire : ${esc(i.resp||"—")}</span><span class="tag">Dessinateur : ${esc(i.dess||"—")}</span></div>
  ${dates(i)}<div class="kv"><div><span>Montant commande</span><b>${eur(i.montant)}</b></div><div><span>Budget achat</span><b>${eur(i.budget)}</b></div><div><span>Total heures</span><b>${num(h)} h</b></div><div><span>Hrs RA</span><b>${num(i.hra)}</b></div><div><span>Hrs Dessin</span><b>${num(i.hdes)}</b></div><div><span>Hrs Ouvriers</span><b>${num(i.hout)}</b></div></div>
  <div style="text-align:right;margin-top:8px"><button class="btn sm" data-pf="${esc(p)}">Modifier la fiche</button></div>`};
const fdt=s=>{const d=new Date(s);return d.toLocaleDateString("fr-BE")+" à "+d.toLocaleTimeString("fr-BE",{hour:"2-digit",minute:"2-digit"})};
const NA="Non assigné";
const RA=["Christophe H.","Christopher A.","Christopher S."],DES=["Damien D.","Dominique J.","Mario M.","Quentin D.","Raphaël C.","Rémi B."],BASE=[...RA,...DES];
try{const u=JSON.parse(localStorage.getItem(UK));users=Array.isArray(u)?u:[]}catch(e){users=[]}
users=[...new Set([...users.map(x=>x==="Christopher Stunz"?"Christopher S.":x),...BASE])].sort((a,b)=>a.localeCompare(b,"fr"));
const saveU=()=>{try{localStorage.setItem(UK,JSON.stringify(users))}catch(e){}schedulePush()};
const ini=n=>n.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const fillRsp=v=>{const rs=[...new Set([...users,...(v?[v]:[])])].sort((a,b)=>a.localeCompare(b,"fr"));$("rsp").innerHTML='<option value="">'+NA+'</option>'+rs.map(r=>`<option ${r===v?"selected":""}>${esc(r)}</option>`).join("")};

function load(){try{const r=localStorage.getItem(KEY);if(r!==null)return JSON.parse(r)||[]}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}schedulePush()}
tasks=load();
if(tasks===null&&!SYNC){const t=today();tasks=[
 {id:1,title:"Vérifier schéma unifilaire TGBT",desc:"Contrôle des références Schneider avant envoi.",proj:"01001234",prio:"Haute",cat:"Projet",due:t,status:"doing",created:1},
 {id:2,title:"Préparer offre de prix client",desc:"Chiffrage et validation interne.",proj:"01005678",prio:"Moyenne",cat:"Travail",due:iso(new Date(Date.now()+3*864e5)),status:"todo",created:2}];save()}
if(tasks===null)tasks=[];

(()=>{let ch=false;const m=x=>x==="Christopher Stunz"?(ch=true,"Christopher S."):x;tasks.forEach(t=>{if(t.rsp)t.rsp=m(t.rsp)});Object.values(pinfo).forEach(i=>{if(i.resp)i.resp=m(i.resp);if(i.dess)i.dess=m(i.dess)});if(ch){save();saveP()}})();
function fmt(d){if(!d)return"";const [y,m,j]=d.split("-");return `${j}/${m}/${y}`}
function visible(){
  const q=$("q").value.trim().toLowerCase(),fs=$("fs").value,fp=$("fp").value,fc=$("fc").value,fr=$("fr").value,so=$("so").value;
  let l=tasks.filter(t=>(!fs||t.status===fs)&&(!fp||t.prio===fp)&&(!fc||t.cat===fc)&&(!fr||(fr==="__na"?!t.rsp:t.rsp===fr))&&(!q||(t.title+" "+t.desc+" "+t.proj+" "+t.cat+" "+(t.rsp||"")).toLowerCase().includes(q)));
  const dueK=t=>t.due||"9999-99-99";
  l.sort((a,b)=>{
    if(so==="prio")return PW[a.prio]-PW[b.prio]||dueK(a).localeCompare(dueK(b));
    if(so==="proj")return a.proj.localeCompare(b.proj);
    if(so==="rsp")return (a.rsp?0:1)-(b.rsp?0:1)||(a.rsp||"").localeCompare(b.rsp||"")||dueK(a).localeCompare(dueK(b))||PW[a.prio]-PW[b.prio];
    if(so==="new")return b.created-a.created;
    return (a.status==="done")-(b.status==="done")||dueK(a).localeCompare(dueK(b))||PW[a.prio]-PW[b.prio];
  });
  return l;
}
function render(){
  const t0=today(),open=tasks.filter(t=>t.status!=="done"),late=open.filter(t=>t.due&&t.due<t0).length;
  $("today").textContent=new Date().toLocaleDateString("fr-BE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  $("stats").innerHTML=[["Restantes",open.length],["En cours",tasks.filter(t=>t.status==="doing").length],["Terminées",tasks.filter(t=>t.status==="done").length],["En retard",late]]
    .map(([l,v],i)=>`<div class="card stat"><b style="${i===3&&v?"color:var(--red)":""}">${v}</b><span>${l}</span></div>`).join("");
  const dt=tasks.filter(t=>t.due===t0),dd=dt.filter(t=>t.status==="done").length,pd=dt.length?Math.round(dd/dt.length*100):0;
  const pg=tasks.length?Math.round(tasks.filter(t=>t.status==="done").length/tasks.length*100):0;
  $("prog").innerHTML=`<div class="card"><div class="row"><b>Progression du jour</b><span class="sub">${dt.length?`${dd}/${dt.length} · ${pd} %`:"Aucune échéance aujourd’hui"}</span></div><div class="bar"><i style="width:${pd}%"></i></div></div>
  <div class="card"><div class="row"><b>Progression globale</b><span class="sub">${pg} %</span></div><div class="bar g"><i style="width:${pg}%"></i></div></div>`;
  const cats=[...new Set(tasks.map(t=>t.cat).filter(Boolean))].sort(),cur=$("fc").value;
  $("fc").innerHTML='<option value="">Toutes catégories</option>'+cats.map(c=>`<option ${c===cur?"selected":""}>${esc(c)}</option>`).join("");
  $("cats").innerHTML=[...new Set(["Travail","Personnel","Projet",...cats])].map(c=>`<option>${esc(c)}</option>`).join("");
  const rs=[...new Set([...users,...tasks.map(t=>t.rsp).filter(Boolean)])].sort((a,b)=>a.localeCompare(b)),cr=$("fr").value;
  $("fr").innerHTML='<option value="">Tous RSP</option><option value="__na">'+NA+'</option>'+rs.map(r=>`<option>${esc(r)}</option>`).join("");$("fr").value=cr;
  const cnt=r=>tasks.filter(t=>t.status!=="done"&&(r==="__na"?!t.rsp:t.rsp===r)).length;
  $("load").innerHTML=rs.length?`<div class="card"><div class="row"><b>Charge par RSP</b><span class="sub">tâches restantes · clic pour filtrer</span></div><div class="chips">`+[...rs,"__na"].map(r=>`<button class="chip ${$("fr").value===r?"on":""}" data-r="${esc(r)}"><span class="av">${r==="__na"?"?":esc(ini(r))}</span>${r==="__na"?NA:esc(r)} <b>${cnt(r)}</b></button>`).join("")+`</div></div>`:"";
  const l=visible();
  $("list").innerHTML=l.length?l.map(t=>{
    const isLate=t.status!=="done"&&t.due&&t.due<t0,soon=t.status!=="done"&&t.due===t0;
    return `<article class="card task p-${t.prio} ${t.status==="done"?"done":""}">
    <button class="chk" data-a="tog" data-id="${t.id}" aria-label="Terminer">${t.status==="done"?"✓":""}</button>
    <div class="body"><div class="t">${esc(t.title)}</div>${t.desc?`<div class="d">${esc(t.desc)}</div>`:""}
    <div class="tags"><button class="tag proj" data-p="${esc(t.proj)}" title="Voir le récap du projet" style="cursor:pointer">N° ${esc(t.proj)}${nc(t.proj)?" · 📝"+nc(t.proj):""}</button><span class="tag">${esc(t.prio)}</span><span class="tag">${esc(t.cat)}</span><span class="tag rsp ${t.rsp?"":"na"}">👤 ${esc(t.rsp||NA)}</span>
    ${t.due?`<span class="tag ${isLate?"late":soon?"soon":""}">${isLate?"En retard · ":soon?"Aujourd’hui · ":"📅 "}${fmt(t.due)}</span>`:""}
    <span class="tag s-${t.status}">${SL[t.status]}</span></div></div>
    <div class="acts"><select data-a="st" data-id="${t.id}">${Object.entries(SL).map(([k,v])=>`<option value="${k}" ${k===t.status?"selected":""}>${v}</option>`).join("")}</select>
    <div style="display:flex;gap:6px"><button class="btn sm" data-a="edit" data-id="${t.id}">Modifier</button>
    <button class="btn sm" data-a="del" data-id="${t.id}" style="${pendingDel===t.id?"background:var(--red);color:#fff;border-color:var(--red)":""}">${pendingDel===t.id?"Confirmer ?":"Supprimer"}</button></div></div></article>`}).join("")
  :`<div class="empty">Aucune tâche à afficher.<br>Ajoutez-en une avec « + Nouvelle tâche ».</div>`;
}
$("list").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b||b.tagName==="SELECT")return;
  const id=+b.dataset.id,t=tasks.find(x=>x.id===id),a=b.dataset.a;
  if(a==="tog"){t.status=t.status==="done"?"todo":"done";pendingDel=null;save();render()}
  else if(a==="edit")openForm(t);
  else if(a==="del"){if(pendingDel===id){tasks=tasks.filter(x=>x.id!==id);pendingDel=null;save()}else{pendingDel=id;setTimeout(()=>{if(pendingDel===id){pendingDel=null;render()}},3000)}render()}
});
$("list").addEventListener("change",e=>{const s=e.target.closest('select[data-a="st"]');if(!s)return;tasks.find(x=>x.id===+s.dataset.id).status=s.value;save();render()});
["q","fs","fp","fc","fr","so"].forEach(i=>$(i).addEventListener("input",render));
$("load").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const r=b.dataset.r;$("fr").value=$("fr").value===r?"":r;render()});

function openForm(t){
  editId=t?t.id:null;$("mt").textContent=t?"Modifier la tâche":"Nouvelle tâche";$("err").textContent="";
  fillRsp(t?t.rsp:"");$("title").value=t?t.title:"";$("desc").value=t?t.desc:"";$("proj").innerHTML='<option value="">— Choisir un projet —</option>'+[...new Set([...allProj(),...(t?[t.proj]:[])])].sort().map(x=>`<option value="${esc(x)}" ${t&&x===t.proj?"selected":""}>${esc(x)}${esc(lbl(x))}</option>`).join("");
  $("due").value=t?t.due:"";$("prio").value=t?t.prio:"Moyenne";$("cat").value=t?t.cat:"Travail";$("stat").value=t?t.status:"todo";
  $("ov").classList.add("on");setTimeout(()=>$("title").focus(),50);
}
const closeForm=()=>$("ov").classList.remove("on");
$("add").onclick=()=>openForm(null);$("cancel").onclick=$("cancel2").onclick=closeForm;
$("ov").addEventListener("mousedown",e=>{if(e.target===$("ov"))closeForm()});
$("form").addEventListener("submit",e=>{
  e.preventDefault();
  const title=$("title").value.trim(),proj=$("proj").value.trim();
  if(!title){$("err").textContent="Le titre est obligatoire.";return}
  if(!/^0100\d*$/.test(proj)){$("err").textContent="Choisissez un projet (à créer d’abord avec « + Nouveau projet »).";return}
  const d={title,rsp:$("rsp").value,desc:$("desc").value.trim(),proj,prio:$("prio").value,cat:$("cat").value.trim()||"Travail",due:$("due").value,status:$("stat").value};
  if(editId){Object.assign(tasks.find(x=>x.id===editId),d)}else{tasks.push({...d,id:Date.now(),created:Date.now()})}
  save();closeForm();render();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeForm()});
function renderU(){$("ulist").innerHTML=users.length?users.map((u,i)=>{const n=tasks.filter(t=>t.rsp===u&&t.status!=="done").length;return `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--border);align-items:center"><span><span class="av">${esc(ini(u))}</span> ${esc(u)} <span class="sub">· ${n} restante${n>1?"s":""}</span></span>${BASE.includes(u)?'<span class="sub">Équipe</span>':`<button type="button" class="btn sm" data-u="${i}" style="${pendingU===i?"background:var(--red);color:#fff;border-color:var(--red)":""}">${pendingU===i?"Confirmer ?":"Retirer"}</button>`}</div>`}).join(""):'<div class="sub">Aucun responsable.</div>'}
$("usrs").onclick=()=>{pendingU=null;$("uerr").textContent="";renderU();$("uov").classList.add("on");setTimeout(()=>$("uname").focus(),50)};
$("uclose").onclick=()=>$("uov").classList.remove("on");
$("uov").addEventListener("mousedown",e=>{if(e.target===$("uov"))$("uov").classList.remove("on")});
$("uadd").addEventListener("submit",e=>{e.preventDefault();const n=$("uname").value.trim().replace(/\s+/g," ");if(!n)return;if(users.some(u=>u.toLowerCase()===n.toLowerCase())){$("uerr").textContent="Ce responsable existe déjà.";return}users.push(n);users.sort((a,b)=>a.localeCompare(b,"fr"));saveU();$("uname").value="";$("uerr").textContent="";renderU();render()});
$("ulist").addEventListener("click",e=>{const b=e.target.closest("[data-u]");if(!b)return;const i=+b.dataset.u;if(pendingU===i){const n=users[i];users.splice(i,1);tasks.forEach(t=>{if(t.rsp===n)t.rsp=""});saveU();save();pendingU=null}else pendingU=i;renderU();render()});
function renderP(){if(pview==="l"){renderL();return}
  const t0=today(),q=$("pq").value.trim().toLowerCase();
  const fs2=$("pst").value,fa2=$("pat").value;
  const ps=[...new Set([...tasks.map(t=>t.proj),...notes.map(n=>n.proj),...Object.keys(pinfo)])].filter(p=>(!q||(p+" "+((pinfo[p]||{}).nom||"")+" "+((pinfo[p]||{}).client||"")).toLowerCase().includes(q))&&(!fs2||(pinfo[p]||{}).statut===fs2)&&(!fa2||(pinfo[p]||{}).atelier===fa2)).sort();
  $("pl").innerHTML=ps.length?`<div class="sub" style="margin-bottom:8px">${ps.length} projet${ps.length>1?"s":""} · ${tot(ps)}</div>`+ps.map(p=>{
    const pt=tasks.filter(t=>t.proj===p),pn=notes.filter(n=>n.proj===p).sort((a,b)=>b.date.localeCompare(a.date));
    const nd=pt.filter(t=>t.status==="done").length,ng=pt.filter(t=>t.status==="doing").length,nt=pt.length-nd-ng;
    const late=pt.filter(t=>t.status!=="done"&&t.due&&t.due<t0).length,pct=pt.length?Math.round(nd/pt.length*100):0;
    const nx=pt.filter(t=>t.status!=="done"&&t.due).map(t=>t.due).sort()[0];
    const rs=[...new Set(pt.map(t=>t.rsp||NA))].sort((a,b)=>a.localeCompare(b,"fr"));
    const ts=[...pt].sort((a,b)=>(a.status==="done")-(b.status==="done")||(a.due||"9999").localeCompare(b.due||"9999"));
    return `<article class="card" style="margin-bottom:12px"><div class="row" style="align-items:center"><span class="tag proj" style="font-size:14px">N° ${esc(p)}</span>${pinfo[p]&&(pinfo[p].nom||pinfo[p].client)?`<span style="flex:1;margin-left:10px;min-width:0;word-break:break-word"><b>${esc(pinfo[p].nom||"")}</b>${pinfo[p].client?`<span class="sub"> · Client : ${esc(pinfo[p].client)}</span>`:""}</span>`:""}</div>
    ${fiche(p)}<b class="sec">Tâches</b><div class="sub">${pt.length} tâche${pt.length>1?"s":""} · ${pct} % terminé</div>
    <div class="bar g"><i style="width:${pct}%"></i></div>
    <div class="tags" style="margin-top:8px"><span class="tag">À faire ${nt}</span><span class="tag s-doing">En cours ${ng}</span><span class="tag s-done">Terminées ${nd}</span>${late?`<span class="tag late">En retard ${late}</span>`:""}${nx?`<span class="tag">Prochaine échéance ${fmt(nx)}</span>`:""}</div>
    ${pt.length?`<div class="tags" style="margin-top:6px">${rs.map(r=>`<span class="tag rsp ${r===NA?"na":""}">👤 ${esc(r)}</span>`).join("")}</div>`:""}

  const I=p=>pinfo[p]||{},act=ps.filter(p=>I(p).statut!=="Livré");

  const soon=act.filter(p=>I(p).dliv&&dayDiff(I(p).dliv)>=0&&dayDiff(I(p).dliv)<=30);
  const kpi=(l,v,c)=>`<div class="card stat"><b style="${c||""}">${v}</b><span>${l}</span></div>`;
  const when=d=>{const n=dayDiff(d);return n<0?`en retard de ${-n} j`:n===0?"aujourd’hui":`dans ${n} j`};
  const sti=p=>Math.max(0,STAT.indexOf(I(p).statut));
  const prow=(p,d)=>`<div class="mr" data-pf="${esc(p)}" style="cursor:pointer"><b>${esc(p)}</b><span class="mt">${esc(I(p).nom||"—")}${I(p).client?` <span class="sub">· ${esc(I(p).client)}</span>`:""}</span><span class="tag st st-${sti(p)}">${esc(I(p).statut||"—")}</span><span class="tag ${dayDiff(d)<0?"late":""}">${fmt(d)} · ${when(d)}</span></div>`;

  const due=open.filter(t=>t.due&&dayDiff(t.due)<=7).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,10);
  const by=STAT.map((s,i)=>({s,i,l:ps.filter(p=>I(p).statut===s)})),ns=ps.filter(p=>!STAT.includes(I(p).statut));
  const mx=Math.max(1,...by.map(x=>x.l.length),ns.length);
  const bar=(tag,n,m)=>`<div class="dr">${tag}<div class="bar" style="margin:0"><i style="width:${n/mx*100}%;background:var(--blue)"></i></div><b>${n}</b><span class="sub">${eur(m)}</span></div>`;
  const sh=by.map(x=>bar(`<span class="tag st st-${x.i}">${esc(x.s)}</span>`,x.l.length,sum(x.l,"montant"))).join("")+(ns.length?bar('<span class="tag st st-0">Sans statut</span>',ns.length,sum(ns,"montant")):"");
  const ats=[...ATE,""].map(a=>({a,l:act.filter(p=>(I(p).atelier||"")===a)})).filter(x=>x.a||x.l.length).map(x=>`<div class="dr2"><b>${esc(x.a||"Non défini")}</b><span>${x.l.length} projet${x.l.length>1?"s":""}</span><span>${num(hrs(x.l))} h</span><span>${eur(sum(x.l,"montant"))}</span></div>`).join("");
  const ppl=(arr,k)=>arr.map(n=>`<span class="chip" style="cursor:default"><span class="av">${esc(ini(n))}</span>${esc(n)} <b>${act.filter(p=>I(p)[k]===n).length}</b></span>`).join("");
  $("vd").innerHTML=(ps.length?"":'<div class="card empty">Aucun projet pour l’instant. Crée-en un avec « + Nouveau projet ».</div>')+
  `<div class="kpis">${kpi("Projets non livrés",act.length)}${kpi("Montant (non livrés)",eur(sum(act,"montant")))}${kpi("Heures prévues (non livrés)",num(hrs(act))+" h")}${kpi("Projets en retard",lp.length,lp.length?"color:var(--red)":"")}${kpi("Livraisons ≤ 30 jours",soon.length)}${kpi("Tâches restantes",open.length)}${kpi("Tâches en retard",lateT.length,lateT.length?"color:var(--red)":"")}</div>
  <div class="dg"><div class="card"><b>Projets par statut</b>${sh}</div>

{const _r=render;render=function(){_r();if(!$("vd").hidden)renderD()}}
const PF=["nom","client","statut","atelier","resp","dess","livr","dcmd","dplans","dliv","montant","budget","hra","hdes","hout"];
function toSrv(){
  const m={projets:{},taches:{},notes:{},personnes:{}};
  Object.keys(pinfo).forEach(p=>{const o={proj:p};PF.forEach(k=>o[k]=pinfo[p][k]===undefined?"":pinfo[p][k]);m.projets[p]=o});
  tasks.forEach(t=>{m.taches[t.id]={id:t.id,proj:t.proj,title:t.title,desc:t.desc||"",prio:t.prio,cat:t.cat,rsp:t.rsp||"",due:t.due||"",status:t.status,created:t.created||""}});
  notes.forEach(n=>{m.notes[n.id]={id:n.id,proj:n.proj,date:n.date,text:n.text}});
  users.filter(u=>!BASE.includes(u)).forEach(u=>{m.personnes[u]={nom:u}});
  return m}
function strMap(m){const s={};for(const t in m){s[t]={};for(const k in m[t])s[t][k]=JSON.stringify(m[t][k])}return s}
function diffOps(cur){const ops=[];for(const t in cur){for(const k in cur[t]){if(!SNAP[t]||SNAP[t][k]!==JSON.stringify(cur[t][k]))ops.push({op:"upsert",table:t,record:cur[t][k]})}if(SNAP[t])for(const k in SNAP[t])if(!(k in cur[t]))ops.push({op:"delete",table:t,key:k})}return ops}
const hm=()=>new Date().toLocaleTimeString("fr-BE",{hour:"2-digit",minute:"2-digit"});
function setStatus(t){const s=$("syn");if(s)s.textContent=t}
function api(p){return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({code:CODE},p))}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})}
function schedulePush(){if(!SYNC||!SNAP)return;clearTimeout(pushT);setStatus("Enregistrement…");pushT=setTimeout(doPush,400)}
async function doPush(){
  pushT=null;if(pushing){dirty=true;return}
  const cur=toSrv(),ops=diffOps(cur);
  if(!ops.length){setStatus("☁ Synchronisé");return}
  pushing=true;
  try{const r=await api({action:"batch",ops});if(!r.ok)throw new Error(r.error||"Erreur");SNAP=strMap(cur);setStatus("☁ Synchronisé à "+hm())}
  catch(e){setStatus("⚠ Échec de l’enregistrement, nouvel essai…");setTimeout(schedulePush,5000)}
  pushing=false;if(dirty){dirty=false;schedulePush()}
}
function applyServer(r){
  tasks=(r.taches||[]).map(t=>({id:Number(t.id),proj:t.proj,title:t.title,desc:t.desc,prio:t.prio,cat:t.cat,rsp:t.rsp,due:t.due,status:t.status,created:Number(t.created)||0}));
  notes=(r.notes||[]).map(n=>({id:Number(n.id),proj:n.proj,date:n.date,text:n.text}));
  pinfo={};(r.projets||[]).forEach(p=>{const o={};PF.forEach(k=>o[k]=p[k]===undefined?"":p[k]);pinfo[p.proj]=o});
  users=[...new Set([...BASE,...(r.personnes||[]).map(x=>x.nom)])].sort((a,b)=>a.localeCompare(b,"fr"));
  SNAP=strMap(toSrv());
}

async function startSync(){
  $("lov").classList.add("on");
  if(!CODE){showLogin("");return}
  $("lform").hidden=true;$("lerr").textContent="";$("lmsg").textContent="Chargement des données…";

    const r=await api({action:"list"});
    if(!r.ok){if(r.error==="CODE"){CODE="";try{localStorage.removeItem("ees_code")}catch(e){}showLogin("Code d’accès incorrect.");return}throw new Error(r.error||"Erreur")}
    try{localStorage.setItem("ees_code",CODE)}catch(e){}
    const empty=!(r.projets||[]).length&&!(r.taches||[]).length&&!(r.notes||[]).length;
    const local=tasks.some(t=>t.id!==1&&t.id!==2)||notes.length>0||Object.keys(pinfo).length>0;
    if(empty&&local&&confirm("La feuille Google est vide. Importer les données enregistrées dans ce navigateur ?")){SNAP={projets:{},taches:{},notes:{},personnes:{}};schedulePush()}
    else{applyServer(r);setStatus("☁ Synchronisé à "+hm())}
    $("lov").classList.remove("on");$("sync").hidden=false;$("lock").hidden=false;afterLoad();
  }catch(e){showLogin("Connexion impossible : "+e.message)}
}
async function refresh(){

}
